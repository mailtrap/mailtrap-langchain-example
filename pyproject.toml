[project]
name = "mailtrap-langchain-example"
version = "0.1.0"
description = "Mailtrap Python SDK wrapped as a LangChain tool, driven by an agent"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=4.3,<5.0",
    "mailtrap>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
]

[project.scripts]
mailtrap-langchain-example = "mailtrap_langchain_example.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtrap_langchain_example"]

[tool.pytest.ini_options]
pythonpath = ["src"]
